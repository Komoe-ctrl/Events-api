name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    # Service Postgres dedie à la suite e2e (lot 4) — jamais partage avec
    # une base de dev/prod, tronque entre chaque test (test/helpers/db.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      JWT_SECRET: ci-placeholder-secret-jamais-utilise-en-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma validate

      - run: npx tsc --noEmit

      - run: npm run lint:ci

      - run: npm test

      - run: npm run test:e2e
